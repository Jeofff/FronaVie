<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Jost',system-ui,sans-serif">
<div style="background:#16295B;color:#fff;padding:11px 0;text-align:center;font:400 12.5px/1 'Jost',sans-serif;letter-spacing:.03em">{{ announce }}</div>
<header style="background:#F5F1E9;padding:20px 56px;display:flex;align-items:center;justify-content:space-between;gap:40px;border-bottom:1px solid rgba(22,41,91,.09)">
<a href="#1a" style="display:block;flex:none"><img src="assets/logo-nav.png" alt="FronaVie" style="height:44px;width:auto;display:block"></a>
<nav style="display:flex;gap:32px;align-items:center">
<sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
<a href="{{ item.href }}" style="position:relative;text-decoration:none;color:#16295B;font:400 12.5px/1 'Jost',sans-serif;letter-spacing:.14em;padding-bottom:5px" style-hover="color:#C1934F">{{ item.label }}<sc-if value="{{ item.active }}"><span style="position:absolute;left:0;right:0;bottom:0;height:1.5px;background:#16295B"></span></sc-if></a>
</sc-for>
</nav>
<div style="display:flex;gap:22px;align-items:center;flex:none">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16295B" stroke-width="1.2"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4.1 3.4-6.5 7.5-6.5s7.5 2.4 7.5 6.5"/></svg>
<div style="position:relative"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16295B" stroke-width="1.2"><path d="M4.5 7.5h15L18 21H6L4.5 7.5Z"/><path d="M8.8 7.5V6a3.2 3.2 0 0 1 6.4 0v1.5"/></svg><sc-if value="{{ hasCart }}"><span style="position:absolute;top:-6px;right:-8px;background:#C1934F;color:#fff;min-width:16px;height:16px;border-radius:8px;font:500 9.5px/16px 'Jost',sans-serif;text-align:center">{{ cart }}</span></sc-if></div>
</div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;HOME&quot;,&quot;OUR STORY&quot;,&quot;OUR SKINCARE&quot;,&quot;INGREDIENTS&quot;,&quot;JOURNAL&quot;,&quot;CONTACT&quot;],&quot;default&quot;:&quot;HOME&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cart&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;announce&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Skincare that does right by those who live earnestly.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "HOME";
    const cart = this.props.cart ?? 0;
    const nav = [["HOME","#1a"],["OUR STORY","#1b"],["OUR SKINCARE","#1c"],["INGREDIENTS","#1e"],["JOURNAL","#1f"],["CONTACT","#1g"]];
    return {
      announce: this.props.announce ?? "Skincare that does right by those who live earnestly.",
      cart, hasCart: cart > 0,
      items: nav.map(([label, href]) => ({ label, href, active: label === active }))
    };
  }
}
</script>
</body>
</html>
