<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join FronaVie</title>
<meta name="description" content="Be the first to know what's blooming at FronaVie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ background:var(--navy); }
  .join-shell{
    position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:110px 24px 70px; color:var(--warm-white); overflow:hidden;
  }
  .join-watermark{
    position:absolute; top:8%; left:50%; transform:translateX(-50%); width:560px; max-width:140vw;
    opacity:.05; pointer-events:none; z-index:0;
  }
  .join-shell > *{ position:relative; z-index:1; }
  .join-shell .logo-img{ height:60px; margin-bottom:50px; }
  .join-eyebrow{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--champagne); margin-bottom:22px; }
  .join-shell h1{ font-size:clamp(30px,4.6vw,48px); line-height:1.25; max-width:600px; margin:0 0 20px; color:var(--warm-white); }
  .join-shell p.sub{ font-size:15px; color:rgba(250,247,242,.68); max-width:420px; margin:0 0 48px; }
  .join-form{ display:flex; gap:0; border-bottom:1px solid rgba(250,247,242,.4); padding-bottom:14px; width:100%; max-width:360px; }
  .join-form input{
    flex:1; border:none; background:transparent; font-family:var(--sans); font-size:15px; outline:none; color:var(--warm-white);
  }
  .join-form input::placeholder{ color:rgba(250,247,242,.5); }
  .join-form button{ background:none; border:none; font-size:12px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; color:var(--warm-white); font-weight:500; }
  .join-back{ margin-top:60px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:rgba(250,247,242,.55); }
  .join-back:hover{ color:var(--warm-white); }
  .join-confirm{ display:none; }
  .join-confirm.show{ display:block; }
</style>
</head>
<body>

<div class="join-shell">

  <svg class="join-watermark" viewBox="0 0 100 100" fill="none" stroke="var(--warm-white)" stroke-width="1.4"><g stroke-linejoin="round"><path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z"/><path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(72 50 50)"/><path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(144 50 50)"/><path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(216 50 50)"/><path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(288 50 50)"/></g></svg>

  <img src="assets/fronavie-logo-full-white.png" alt="FronaVie. Brightening without stripping." class="logo-img">

  <div id="joinForm">
    <div class="join-eyebrow">Join Us</div>
    <h1>Something beautiful is blooming.</h1>
    <p class="sub">Be the first to discover the FronaVie ritual, new skincare releases, and the Filipino traditions that shape everything we make.</p>
    <form class="join-form" id="joinFormEl">
      <input type="email" placeholder="Your email address" required aria-label="Email address">
      <button type="submit">Join FronaVie</button>
    </form>
  </div>

  <div class="join-confirm" id="joinConfirm">
    <div class="join-eyebrow">You're In</div>
    <h1>Welcome to FronaVie.</h1>
    <p class="sub">We'll write when we have something worth saying.</p>
  </div>

  <a href="index.html" class="join-back">Back to FronaVie</a>

</div>

<script>
  document.getElementById('joinFormEl').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('joinForm').style.display = 'none';
    document.getElementById('joinConfirm').classList.add('show');
  });
</script>
</body>
</html>
