<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FronaVie</title>
<meta name="description" content="Welcome to FronaVie. Filipino beauty heritage, thoughtfully reimagined for modern skin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* QR landing: a different experience from the main site: no nav,
     no footer, one screen, one decision. Mobile-first, fast, focused. */
  body{ background:var(--warm-white); }
  .qr-shell{
    max-width:440px; margin:0 auto; min-height:100vh; box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:48px 28px; text-align:center;
  }
  .qr-logo{ height:108px; width:auto; margin-bottom:20px; }
  .qr-tagline{
    font-family:var(--sans); font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--navy-soft); opacity:.75; margin-bottom:26px;
  }
  .qr-welcome{
    font-family:var(--serif); font-style:italic; font-size:18px; line-height:1.5;
    color:var(--navy); max-width:320px; margin-bottom:40px;
  }
  .qr-plate{ width:100%; aspect-ratio:1/1; margin-bottom:44px; }
  .qr-actions{ display:flex; flex-direction:column; gap:14px; width:100%; }
  .qr-actions .btn{ width:100%; justify-content:center; padding:17px 20px; }
  .qr-actions .btn.quiet{ border:1px solid var(--navy); }
</style>
</head>
<body>

<div class="qr-shell">

  <img src="assets/fronavie-logo-nav.png" alt="FronaVie" class="qr-logo">
  <div class="qr-tagline">Brightening without stripping</div>

  <p class="qr-welcome">Filipino beauty heritage, thoughtfully reimagined for modern skin.</p>

  <div class="ritual-plate qr-plate">
    <div class="plate-fill">
      <svg class="plate-mark" width="120" height="120" viewBox="0 0 100 100" fill="none" stroke="var(--navy)" stroke-width="1.8">
        <g stroke-linejoin="round">
          <path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z"/>
          <path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(72 50 50)"/>
          <path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(144 50 50)"/>
          <path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(216 50 50)"/>
          <path d="M50 8c8 0 13 10 13 20 0 8-6 14-13 14s-13-6-13-14c0-10 5-20 13-20z" transform="rotate(288 50 50)"/>
        </g>
      </svg>
    </div>
    <span class="plate-caption">Plate: FronaVie. Photography in progress.</span>
  </div>

  <div class="qr-actions">
    <a href="index.html" class="btn solid">Discover FronaVie</a>
    <a href="the-ritual.html" class="btn quiet">Explore the Ritual</a>
    <a href="join.html" class="btn quiet">Join the List</a>
  </div>

</div>

</body>
</html>
