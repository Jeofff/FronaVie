<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FronaVie</title>
<meta name="description" content="Welcome to FronaVie. Filipino beauty heritage, thoughtfully reimagined for modern skin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ background:var(--warm-white); }
  .qr-shell{ max-width:420px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  .qr-photo{ aspect-ratio:1/1; }
  .qr-body{ flex:1; padding:36px 28px 40px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .qr-body .logo-img{ height:44px; margin-bottom:26px; }
  .qr-body h1{ font-size:26px; line-height:1.3; margin-bottom:14px; }
  .qr-body p.sub{ font-size:14px; color:var(--navy-soft); max-width:300px; margin-bottom:34px; }
  .qr-actions{ display:flex; flex-direction:column; gap:12px; width:100%; }
  .qr-actions .btn{ width:100%; justify-content:center; padding:16px 20px; }
</style>
</head>
<body>

<div class="qr-shell">

  <div class="photo light qr-photo">
    <img src="https://picsum.photos/seed/fronavie-qr/700/700" alt="FronaVie, placeholder photography">
  </div>

  <div class="qr-body">
    <img src="assets/fronavie-logo-nav.png" alt="FronaVie" class="logo-img">
    <h1>Welcome to FronaVie.</h1>
    <p class="sub">Filipino beauty heritage, thoughtfully reimagined for modern skin.</p>

    <div class="qr-actions">
      <a href="index.html" class="btn solid">Discover FronaVie</a>
      <a href="the-ritual.html" class="btn quiet" style="border:1px solid var(--navy); justify-content:center;">Explore the ritual</a>
      <a href="join.html" class="btn quiet" style="border:1px solid var(--navy); justify-content:center;">Join the list</a>
    </div>
  </div>

</div>

</body>
</html>
